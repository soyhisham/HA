# ---------- JPA / Hibernate ----------
# "update" creates/updates tables from the entities automatically (fine for a college project)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Mail (Gmail SMTP example; use an App Password, not your real password) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Default admin account (created on first start if missing) ----------
# CHANGE THE PASSWORD before showing or deploying the project; override with ADMIN_EMAIL / ADMIN_PASSWORD
app.admin.email=${ADMIN_EMAIL:admin@hospital.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}

# ---------- Application e-mail settings ----------
# Set MAIL_ENABLED=false to skip sending (the e-mail is only written to the log), handy when no SMTP account is set up.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
# Timeouts (ms) so a wrong host or blocked network cannot keep a background thread waiting forever
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Demo data (sample doctors, slots, one patient) ----------
# Created only when the database has no doctors. Set SEED_DEMO_DATA=false to turn it off.
app.seed.enabled=${SEED_DEMO_DATA:true}
app.seed.password=${SEED_PASSWORD:Demo@1234}
