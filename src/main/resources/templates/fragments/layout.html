<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Shared <head>: every page includes it with its own title -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Hospital Booking'">Hospital Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<!-- Shared navigation bar. sec:authorize shows items depending on login state and role. -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Hospital Booking</a>
        <div class="d-flex align-items-center gap-2">
            <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Login</a>
                <a class="btn btn-light btn-sm" th:href="@{/register}">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="text-white-50 small" sec:authentication="name">user</span>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
                <a sec:authorize="hasRole('DOCTOR')" class="btn btn-outline-light btn-sm" th:href="@{/doctor/dashboard}">Dashboard</a>
                <span sec:authorize="hasRole('PATIENT')" class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/patient/doctors}">Find Doctors</a>
                    <a class="btn btn-outline-light btn-sm" th:href="@{/patient/appointments}">My Appointments</a>
                </span>
                <!-- Logout must be a POST form because CSRF protection is on -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<!-- Success / error messages passed from controllers as flash attributes -->
<div th:fragment="alerts" class="container mt-3">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
