<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">Login</h3>

                    <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
                    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
                    <div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in.</div>

                    <!-- Spring Security processes this POST; th:action also inserts the CSRF token -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">New patient? <a th:href="@{/register}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
